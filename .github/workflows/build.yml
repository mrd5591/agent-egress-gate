name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.24", "1.25"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo. It is enabled explicitly because the
      # Windows runner defaults CGO_ENABLED to 0 when no compiler is on PATH,
      # which would silently skip race detection rather than fail.
      - name: Test with race detector and coverage floor
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: ./scripts/coverage.sh

      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      # -backend=false because there is no state backend and none is needed:
      # this job validates configuration, it does not plan or apply. See the
      # README on why nothing here is applied.
      - name: Validate module
        working-directory: terraform/modules/egress-gate
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate example
        working-directory: terraform/example
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error
